services:
  web:
    image: tomcat:9-jre11
    container_name: web_server
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - secgov_network

  database:
    image: mysql:5.7
    container_name: database_server
    environment:
      MYSQL_ROOT_PASSWORD: CHANGE_ME_ROOT_PASSWORD
      MYSQL_DATABASE: customer_data
      MYSQL_USER: app_user
      MYSQL_PASSWORD: CHANGE_ME_APP_PASSWORD
    volumes:
      - ./database_init:/docker-entrypoint-initdb.d
    networks:
      - secgov_db_network

  monitoring:
    image: ubuntu:20.04
    container_name: monitoring_server
    volumes:
      - ./monitoring:/monitoring
    command: tail -f /dev/null
    networks:
      - secgov_network
      - secgov_db_network

networks:
  secgov_network:
    external: true
  secgov_db_network:
    external: true
